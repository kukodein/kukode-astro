name: Scheduled Rebuild

on:
  schedule:
    # Jalan tiap jam, di menit ke-0. Format cron: menit jam tgl bulan hari.
    # Catatan: waktu di GitHub Actions cron pakai UTC, bukan WIB.
    - cron: '0 * * * *'
  workflow_dispatch:
    # Supaya tetap bisa trigger manual dari tab "Actions" di GitHub kalau perlu rebuild segera,
    # tanpa harus menunggu jadwal jam berikutnya.

jobs:
  trigger-vercel-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" \
            --fail \
            --silent \
            --show-error
